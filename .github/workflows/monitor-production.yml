name: Monitor production wind

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-wind-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run monitor:production
