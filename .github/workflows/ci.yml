name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v9
        with:
          version: 0.11.32
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv sync --all-groups --frozen
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun run check:pipeline
      - run: bun run test:ui
