name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Six-hourly freshness sweep: a stale production manifest must be caught even
  # when nothing is pushed. Offset from the ingest (hourly) and monitor crons.
  schedule:
    - cron: "48 */6 * * *"
  workflow_dispatch:
    inputs:
      # Regenerate the Playwright visual baselines in CI (removing UI legitimately
      # changes the frame): the run uploads tests/visual.spec.ts-snapshots/ as an
      # artifact, which a human then commits. Browser rendering never happens on
      # the gateway host.
      update_snapshots:
        description: "Regenerate the visual snapshots and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, unit tests, build, browser suite and pipeline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.32
          enable-cache: true
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --all-groups --frozen
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Prettier, TypeScript, Vitest and build
        run: bun run check
      - name: Ruff and pytest for the pipeline
        run: bun run check:pipeline
      - name: Playwright desktop and mobile suite
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            echo "regenerating visual baselines"
            bunx playwright test --grep-invert @performance --update-snapshots
          else
            bun run test:ui
          fi
      - name: Upload regenerated visual snapshots
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual.spec.ts-snapshots/
          if-no-files-found: error
      - name: Playwright performance budgets
        run: bun run test:performance
        env:
          # GitHub-hosted runners share a CPU and render in software, so their
          # frame-rate ceiling sits near 48 FPS (run 34555430406 measured
          # desktop 47/48/48.2, median 48). Both floors are the ~30 FPS
          # shared-runner target the spec documents (tests/performance.spec.ts,
          # docs/TESTING.md) and still catch a real regression. The 55 FPS
          # desktop / 30 FPS mobile device targets stay in-spec defaults.
          PERFORMANCE_DESKTOP_FPS_MINIMUM: 30
          PERFORMANCE_MOBILE_FPS_MINIMUM: 30

  freshness:
    name: Production freshness guard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install the Playwright Chromium runtime
        run: bunx playwright install --with-deps chromium
      - name: Fail if the deployed manifest's newest modelRun is older than 12 hours
        env:
          PLAYWRIGHT_BASE_URL: https://saudi-wind.pages.dev
          WIND_MANIFEST_URL: https://saudi-wind.pages.dev/api/wind/latest
          WIND_FRESHNESS_ENFORCE: "1"
          WIND_FRESHNESS_MAX_AGE_HOURS: "12"
        run: >-
          bunx playwright test tests/freshness.spec.ts
          --project=desktop-chromium --reporter=github
